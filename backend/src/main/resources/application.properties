# ==== Servidor ====
server.port=8080

# ==== Base de datos PostgreSQL (ver docker-compose.yml) ====
# Estos valores los usa ConexionDB (Singleton) directamente via JDBC,
# NO Spring Data, por eso no hay spring.datasource.* de JPA aqui.
db.url=jdbc:postgresql://127.0.0.1:5433/bustracka_db
db.usuario=bustracka_user
db.password=bustracka_pass
db.driver=org.postgresql.Driver

# ==== JWT ====
# Clave secreta HS256 (>= 256 bits). SOLO para desarrollo academico:
# en un entorno real iria en una variable de entorno / vault, nunca en el repo.
jwt.secret=c3ByaW50MS1idXN0cmFja2Etc2VjcmV0LWtleS1hY2FkZW1pY28tMjAyNi1jaGFuZ2VtZQ==
jwt.expiration-ms=3600000

# ==== Logging ====
logging.level.pe.edu.ulima.is2.bustracka=DEBUG
